databaseChangeLog:
  - changeSet:
      id: hu-06-009-link-preconsultation-to-appointment
      author: JulianaFerro1428
      comment: Link HU-06 pre-consultation persistence to an external appointment reference
      changes:
        - runCommand:
            command: |
              {"collMod":"conversations","validator":{"$and":[{"$jsonSchema":{"bsonType":"object","required":["_id","patientId","appointmentId","startDateTime","status","questionLimit","questionsAsked","createdAt","updatedAt"],"additionalProperties":false,"properties":{"_id":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"patientId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"appointmentId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"startDateTime":{"bsonType":"date"},"endDateTime":{"bsonType":"date"},"status":{"enum":["ACTIVE","FINISHED"]},"questionLimit":{"bsonType":"int","minimum":1},"questionsAsked":{"bsonType":"int","minimum":0},"finalizationReason":{"enum":["COMPLETED","QUESTION_LIMIT_REACHED"]},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"}}}},{"$expr":{"$lte":["$questionsAsked","$questionLimit"]}},{"$or":[{"status":{"$ne":"FINISHED"}},{"endDateTime":{"$type":"date"}}]},{"$or":[{"status":{"$ne":"FINISHED"}},{"finalizationReason":{"$in":["COMPLETED","QUESTION_LIMIT_REACHED"]}}]},{"$or":[{"status":{"$ne":"ACTIVE"}},{"endDateTime":{"$exists":false}}]},{"$or":[{"status":{"$ne":"ACTIVE"}},{"finalizationReason":{"$exists":false}}]},{"$or":[{"finalizationReason":{"$ne":"QUESTION_LIMIT_REACHED"}},{"$expr":{"$eq":["$questionsAsked","$questionLimit"]}}]}]},"validationLevel":"strict","validationAction":"error"}

        - runCommand:
            command: |
              {"collMod":"preconsultation_summaries","validator":{"$jsonSchema":{"bsonType":"object","required":["_id","conversationId","appointmentId","patientId","consultationReason","createdAt"],"additionalProperties":false,"properties":{"_id":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"conversationId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"appointmentId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"patientId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"consultationReason":{"bsonType":"string","minLength":1},"evolutionTime":{"bsonType":"string","minLength":1},"detailedSymptoms":{"bsonType":"string","minLength":1},"relevantHistory":{"bsonType":"string","minLength":1},"createdAt":{"bsonType":"date"}}}},"validationLevel":"strict","validationAction":"error"}

        - runCommand:
            command: |
              {"collMod":"outbox_events","validator":{"$jsonSchema":{"bsonType":"object","required":["_id","eventType","aggregateType","aggregateId","correlationId","status","occurredAt","createdAt","payload"],"additionalProperties":false,"properties":{"_id":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"eventType":{"enum":["PreConsultationSummaryGenerated"]},"aggregateType":{"enum":["PRECONSULTATION_SUMMARY"]},"aggregateId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"correlationId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"status":{"enum":["PENDING","PUBLISHED","FAILED"]},"occurredAt":{"bsonType":"date"},"createdAt":{"bsonType":"date"},"payload":{"bsonType":"object","required":["summaryId","appointmentId","patientId","conversationId","generatedAt"],"additionalProperties":false,"properties":{"summaryId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"appointmentId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"patientId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"conversationId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"generatedAt":{"bsonType":"date"}}}}}},"validationLevel":"strict","validationAction":"error"}

      rollback:
        - runCommand:
            command: |
              {"collMod":"outbox_events","validator":{"$jsonSchema":{"bsonType":"object","required":["_id","eventType","aggregateType","aggregateId","correlationId","status","occurredAt","createdAt","payload"],"additionalProperties":false,"properties":{"_id":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"eventType":{"enum":["PreConsultationSummaryGenerated"]},"aggregateType":{"enum":["PRECONSULTATION_SUMMARY"]},"aggregateId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"correlationId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"status":{"enum":["PENDING","PUBLISHED","FAILED"]},"occurredAt":{"bsonType":"date"},"createdAt":{"bsonType":"date"},"payload":{"bsonType":"object","required":["summaryId","patientId","conversationId","generatedAt"],"additionalProperties":false,"properties":{"summaryId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"patientId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"conversationId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"generatedAt":{"bsonType":"date"}}}}}},"validationLevel":"strict","validationAction":"error"}

        - runCommand:
            command: |
              {"collMod":"preconsultation_summaries","validator":{"$jsonSchema":{"bsonType":"object","required":["_id","conversationId","patientId","consultationReason","createdAt"],"additionalProperties":false,"properties":{"_id":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"conversationId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"patientId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"consultationReason":{"bsonType":"string","minLength":1},"evolutionTime":{"bsonType":"string","minLength":1},"detailedSymptoms":{"bsonType":"string","minLength":1},"relevantHistory":{"bsonType":"string","minLength":1},"createdAt":{"bsonType":"date"}}}},"validationLevel":"strict","validationAction":"error"}

        - runCommand:
            command: |
              {"collMod":"conversations","validator":{"$and":[{"$jsonSchema":{"bsonType":"object","required":["_id","patientId","startDateTime","status","createdAt","updatedAt"],"additionalProperties":false,"properties":{"_id":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"patientId":{"bsonType":"string","pattern":"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"},"startDateTime":{"bsonType":"date"},"endDateTime":{"bsonType":"date"},"status":{"enum":["ACTIVE","FINISHED"]},"createdAt":{"bsonType":"date"},"updatedAt":{"bsonType":"date"}}}},{"$or":[{"status":{"$ne":"FINISHED"}},{"endDateTime":{"$type":"date"}}]}]},"validationLevel":"strict","validationAction":"error"}
